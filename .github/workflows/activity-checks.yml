name: Interactive activity checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Reusable calls use the caller's workflow name. Keep Pages checks separate
  # from a direct push/check run on the same branch.
  group: activities-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interactive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test exact models and recipe format
        run: node --test tests/bridge.test.mjs tests/model.test.mjs tests/activity-recipe.test.mjs
      - name: Install bounded browser test tooling
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.62.1
          npx --no-install playwright install --with-deps chromium
      - name: Build and verify authoring and play
        run: |
          python -I -B build.py
          python -I -B -m http.server 8775 --bind 127.0.0.1 --directory .build > /tmp/activity-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8775/manifest.json > /dev/null; then break; fi
            sleep 0.25
          done
          node tests/activity-studio-browser.mjs http://127.0.0.1:8775/ /tmp/activity-browser-evidence
          node tests/learning-lab-browser.mjs http://127.0.0.1:8775/ /tmp/learning-lab-evidence
